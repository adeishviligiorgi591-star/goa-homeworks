<!--3) შექმენი გვერდი „ჩემი საყვარელი ბრენდები“.
გამოიტანე მინიმუმ 5 ბრენდი <ul>-ის გამოყენებით და თითოეულისთვის გააკეთე ცალკე <a> ლინკი.
    სავალდებულოდ გამოიყენე:
<h1>, <h2>, <p>, <img>, <a>, <ul>, <ol>, <li>
და შესაბამისი attributes: href, src, alt, width, target.-->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ჩემი საყვარელი ბრენდები</title>
    </head>
    <body>
        <h1>ჩემი საყვარელი ბრენდები</h1>
        <h2> რა არის ჩემი საყვარელი ბრენდები?</h2>
        <ul>
            <li>gucci</li>
            <li>new balance</li>
            <li>samsung</li>
            <li>mercedes</li>
            <li>nike</li>
        </ul>
        <img width="300" src="https://tse1.mm.bing.net/th/id/OIP.KGJcINISDx-OTT533fXPkAHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="gucci photo">
        <img src="https://tse3.mm.bing.net/th/id/OIP.VheojE9Flky-gDEbIyV6KQHaFB?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="new balance photo">
        <img src="https://www.geeky-gadgets.com/wp-content/uploads/2025/10/samsung-galaxy-s26-ultra-camera-technology_optimized.jpg" alt="samsung photo">
        <img src="https://tse4.mm.bing.net/th/id/OIP.m7NR8nbAuLjclRCldplheQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="merecedes photo">
        <img src="https://static.nike.com/a/images/t_web_pw_592_v2/f_auto/7755255b-fe67-424e-a09d-8bac2da97154/NIKE+P-6000.png" alt="nike photo">
        <p>რატომ მომწონს მე ისინი</p>
        <ol>
            <li>კარგია</li>
            <li>ხარისხიანია</li>
        </ol>
    </body>
    </html>
