<!--2) კომენტარის სახით ახსენით დღეს ნასწავლი თითოეული კუთვნილება რა რას აკეთებს: 
color, font-size, text-align, border, border-radius

color-აძლევს ტექსტს ფერს
font size-ტექსტს აძლევს ზომას
text-alingn-ამას ტექსტი გადაყავს ერთ ხაზზე კონკრეტულ ადგილას(სადაც მიუთითებ იქ)
border-ტექსტის ან სხვა თაგის backgrounds შემოარტყავს კონკრეტული ფერის საზღვარს
border-radius-ამით ამრგვალებ ბორდერს
