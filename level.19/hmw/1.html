<!--1. ჩემი პირველი ვებგვერდი

შექმენი HTML გვერდი თემაზე „ჩემ შესახებ“.

გამოიყენე:

- <h1> — მთავარი სათაური
- <h2> — ქვესათაური
- <p> — მინიმუმ 3 აბზაცი
- <strong> და <b> — მნიშვნელოვანი სიტყვების გამოსაყოფად
- <em> და <i> — ტექსტის დასახრელად
- <hr> — სექციების გასაყოფად

გვერდზე დაწერე:
- შენი სახელი
- შენი ასაკი
- შენი ჰობი
- რატომ მოგწონს პროგრამირება-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემ შესახებ</title>
</head>
<body>
    <h1>ჩემ შესახებ</h1>
    <h2>ჩემი სახელი, გვარი ჩემი ჰობი და მიზეზი თუ რატომ მომწონს პროგრამირება </h2>
    <hr>
    <p>ჩემი სახელია<strong>გიორგი</strong> ხოლო ჩემი გვარია <b>ადეიშვილი</b></p>
    <p>ჩემი ჰობია <em>ფეხბურთის</em> თამაში და ასევე <strong>ჭადრაკის თამაში.</strong></p>
    <p><i>პროგრამირებაში</i> მე მომწონს რომ არის ძალიან საინტერესო და გსიამოვნებს როცა შენით შექმნი პატარა <strong>პროგრამასაც</strong> კი</p>
    
</body>
</html>
