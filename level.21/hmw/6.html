<!--6. Contact Form

შექმენი <form>, რომელშიც იქნება:

label — Name
input — სახელის შესაყვანად

label — Email
input — Email-ის შესაყვანად

button — Send-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="">Name:</label>
        <input type="text" placeholder="Enter your name">
        <br>
        <br>
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your Email">
        <br>
        <br>
        <button>Send</button>
    </form>
</body>
</html>
